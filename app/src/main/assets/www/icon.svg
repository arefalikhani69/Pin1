<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#27272a" stroke-width="6"/>

  <!-- ECU / Connector Shell Shape -->
  <rect x="96" y="112" width="320" height="288" rx="28" fill="#18181b" stroke="#3f3f46" stroke-width="8"/>
  <!-- Keyway notch on connector top -->
  <path d="M 226 112 L 226 136 L 286 136 L 286 112" fill="#09090b" stroke="#3f3f46" stroke-width="8"/>
  <!-- Release latch clip -->
  <rect x="236" y="80" width="40" height="32" rx="6" fill="#ef4444" stroke="#b91c1c" stroke-width="4"/>

  <!-- Pin Grid (Automotive ECU Pins 4x6 matrix) -->
  <!-- Row 1 -->
  <circle cx="156" cy="184" r="14" fill="#fbbf24" stroke="#d97706" stroke-width="3"/>
  <circle cx="206" cy="184" r="14" fill="#52525b" stroke="#3f3f46" stroke-width="3"/>
  <circle cx="256" cy="184" r="14" fill="#52525b" stroke="#3f3f46" stroke-width="3"/>
  <circle cx="306" cy="184" r="14" fill="#ef4444" stroke="#b91c1c" stroke-width="3"/>
  <circle cx="356" cy="184" r="14" fill="#38bdf8" stroke="#0284c7" stroke-width="3"/>

  <!-- Row 2 -->
  <circle cx="156" cy="236" r="14" fill="#52525b" stroke="#3f3f46" stroke-width="3"/>
  <circle cx="206" cy="236" r="14" fill="#ef4444" stroke="#b91c1c" stroke-width="3"/>
  <circle cx="256" cy="236" r="14" fill="#22c55e" stroke="#16a34a" stroke-width="3"/>
  <circle cx="306" cy="236" r="14" fill="#52525b" stroke="#3f3f46" stroke-width="3"/>
  <circle cx="356" cy="236" r="14" fill="#fbbf24" stroke="#d97706" stroke-width="3"/>

  <!-- Row 3 -->
  <circle cx="156" cy="288" r="14" fill="#52525b" stroke="#3f3f46" stroke-width="3"/>
  <circle cx="206" cy="288" r="14" fill="#38bdf8" stroke="#0284c7" stroke-width="3"/>
  <circle cx="256" cy="288" r="14" fill="#52525b" stroke="#3f3f46" stroke-width="3"/>
  <circle cx="306" cy="288" r="14" fill="#ef4444" stroke="#b91c1c" stroke-width="3"/>
  <circle cx="356" cy="288" r="14" fill="#52525b" stroke="#3f3f46" stroke-width="3"/>

  <!-- Row 4 -->
  <circle cx="156" cy="340" r="14" fill="#22c55e" stroke="#16a34a" stroke-width="3"/>
  <circle cx="206" cy="340" r="14" fill="#52525b" stroke="#3f3f46" stroke-width="3"/>
  <circle cx="256" cy="340" r="14" fill="#fbbf24" stroke="#d97706" stroke-width="3"/>
  <circle cx="306" cy="340" r="14" fill="#52525b" stroke="#3f3f46" stroke-width="3"/>
  <circle cx="356" cy="340" r="14" fill="#ef4444" stroke="#b91c1c" stroke-width="3"/>

  <!-- Electric Bolt overlay across badge -->
  <path d="M 280 200 L 230 270 L 265 270 L 225 350 L 295 260 L 260 260 Z" fill="url(#amberGrad)" filter="url(#glow)"/>
</svg>
